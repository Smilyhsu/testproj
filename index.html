<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中央洗鞋廠產能調度與動態模擬系統</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --input-bg: #fef08a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-color);
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .input-group {
            display: grid;
            grid-template-columns: 1.5fr 1fr 0.5fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        label { font-weight: 600; }
        input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: var(--input-bg);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .unit { color: #64748b; font-size: 14px; }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .result-val { font-weight: bold; color: var(--primary-color); }
        .status-badge {
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
        .status-success { background-color: #dcfce7; color: #166534; }
        .status-error { background-color: #fee2e2; color: #991b1b; }
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px 10px;
            text-align: center;
            font-size: 14px;
            vertical-align: middle;
        }
        th { background-color: #f1f5f9; color: var(--primary-color); }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #cbd5e1;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .legend-container {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>👟 中央洗鞋廠產能調度與動態模擬系統</h1>
        <p>調整左側黃色儲存格，系統將即時診斷並重新產生帶有「同批同色」視覺化看板的 24 小時動態表</p>
    </header>

    <div class="grid-layout">
        <div class="card">
            <h2>1. 廠房硬體與排程參數</h2>
            <div class="input-group">
                <label>洗鞋機總數量</label>
                <input type="number" id="num_washers" value="2" oninput="updateAll()">
                <span class="unit">台</span>
            </div>
            <div class="input-group">
                <label>單次最大洗鞋量</label>
                <input type="number" id="wash_cap" value="240" oninput="updateAll()">
                <span class="unit">雙 / 次</span>
            </div>
            <div class="input-group">
                <label>每日清洗輪次</label>
                <input type="number" id="wash_cycles" value="8" oninput="updateAll()">
                <span class="unit">次 / 天</span>
            </div>
            <div class="input-group">
                <label>預計烘乾房數量</label>
                <input type="number" id="num_rooms" value="4" oninput="updateAll()">
                <span class="unit">間</span>
            </div>
            <div class="input-group">
                <label>每間房可放架數</label>
                <input type="number" id="racks_per_room" value="5" oninput="updateAll()">
                <span class="unit">架 / 間</span>
            </div>
            <hr style="border:0; border-top:1px solid #e2e8f0; margin:20px 0;">
            <div class="input-group">
                <label>【A架】單架容量 / 烘乾耗時</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="rack_a_cap" value="40" style="width:60px;" oninput="updateAll()">
                    <input type="number" id="rack_a_hours" value="2" style="width:60px;" oninput="updateAll()">
                </div>
                <span class="unit">雙 / 小時</span>
            </div>
            <div class="input-group">
                <label>【B架】單架容量 / 烘乾耗時</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="rack_b_cap" value="80" style="width:60px;" oninput="updateAll()">
                    <input type="number" id="rack_b_hours" value="4" style="width:60px;" oninput="updateAll()">
                </div>
                <span class="unit">雙 / 小時</span>
            </div>
        </div>

        <div class="card">
            <h2>2. 數據綜合指標診斷</h2>
            <div class="result-item">
                <span>每日總洗鞋需求量：</span>
                <span class="result-val" id="res_total_wash">0 雙</span>
            </div>
            <div class="result-item">
                <span>清洗峰值時速：</span>
                <span class="result-val" id="res_wash_rate">0 雙/小時</span>
            </div>
            <div class="result-item">
                <span>【A架】全廠每小時烘乾產能：</span>
                <span class="result-val" id="res_rate_a">0 雙/小時</span>
            </div>
            <div class="result-item">
                <span>【B架】全廠每小時烘乾產能：</span>
                <span class="result-val" id="res_rate_b">0 雙/小時</span>
            </div>

            <div id="diag_a" class="status-badge"></div>
            <div id="diag_b" class="status-badge"></div>
        </div>
    </div>

    <div class="card">
        <h2>3. 廠線逐時流水線模擬動態表</h2>
        <div class="tab-buttons">
            <button class="tab-btn active" id="btn_tab_a" onclick="switchTab('A')">看 A 型架模擬動態</button>
            <button class="tab-btn" id="btn_tab_b" onclick="switchTab('B')">看 B 型架模擬動態</button>
        </div>
        
        <div id="color_legend" class="legend-container"></div>

        <div class="table-container">
            <table id="schedule_table">
                <thead>
                    <tr>
                        <th style="width: 100px;">時間段</th>
                        <th>W1 (洗)</th>
                        <th>W2 (洗)</th>
                        <th>D1 (房1)</th>
                        <th>D2 (房2)</th>
                        <th>D3 (房3)</th>
                        <th>D4 (房4)</th>
                        <th style="width: 180px;">⚠️ 暫存區 (排隊濕鞋)</th>
                    </tr>
                </thead>
                <tbody id="table_body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentTab = 'A';
    
    // 馬卡龍/柔和高對比色系，確保文字易讀性
    const batchColors = [
        '#fef08a', // 🟡 黃色 (批次 1)
        '#bbf7d0', // 🟢 綠色 (批次 2)
        '#bfdbfe', // 🔵 藍色 (批次 3)
        '#fed7aa', // 🟠 橘色 (批次 4)
        '#e9d5ff', // 🟣 紫色 (批次 5)
        '#fecaca', // 🔴 紅色 (批次 6)
        '#fed7e2', // 💗 粉色 (批次 7)
        '#ccfbf1', // 🟢 薄荷綠 (批次 8)
        '#e2e8f0'  // ⚪ 灰色 (批次 9+)
    ];

    function switchTab(type) {
        currentTab = type;
        document.getElementById('btn_tab_a').classList.toggle('active', type === 'A');
        document.getElementById('btn_tab_b').classList.toggle('active', type === 'B');
        updateAll();
    }

    function updateAll() {
        const num_washers = parseInt(document.getElementById('num_washers').value) || 0;
        const wash_cap = parseInt(document.getElementById('wash_cap').value) || 0;
        const wash_cycles = parseInt(document.getElementById('wash_cycles').value) || 0;
        const num_rooms = parseInt(document.getElementById('num_rooms').value) || 0;
        const racks_per_room = parseInt(document.getElementById('racks_per_room').value) || 0;
        
        const rack_a_cap = parseInt(document.getElementById('rack_a_cap').value) || 0;
        const rack_a_hours = parseInt(document.getElementById('rack_a_hours').value) || 0;
        const rack_b_cap = parseInt(document.getElementById('rack_b_cap').value) || 0;
        const rack_b_hours = parseInt(document.getElementById('rack_b_hours').value) || 0;

        const total_wash = num_washers * wash_cap * wash_cycles;
        const wash_rate = num_washers * wash_cap;
        const rate_a = ((num_rooms * racks_per_room * rack_a_cap) / rack_a_hours) || 0;
        const rate_b = ((num_rooms * racks_per_room * rack_b_cap) / rack_b_hours) || 0;

        document.getElementById('res_total_wash').innerText = total_wash + " 雙";
        document.getElementById('res_wash_rate').innerText = wash_rate + " 雙/小時";
        document.getElementById('res_rate_a').innerText = rate_a.toFixed(0) + " 雙/小時";
        document.getElementById('res_rate_b').innerText = rate_b.toFixed(0) + " 雙/小時";

        const diagA = document.getElementById('diag_a');
        if(rate_a >= wash_rate) {
            diagA.className = "status-badge status-success";
            diagA.innerText = "🟢 A架診斷：時速匹配！白天完全不會積壓濕鞋。";
        } else {
            diagA.className = "status-badge status-error";
            diagA.innerText = "🔴 A架診斷：烘乾太慢！白天暫存區會堆積鞋子。";
        }

        const diagB = document.getElementById('diag_b');
        if(rate_b >= wash_rate) {
            diagB.className = "status-badge status-success";
            diagB.innerText = "🟢 B架診斷：時速匹配！白天完全不會積壓濕鞋。";
        } else {
            diagB.className = "status-badge status-error";
            diagB.innerText = "🔴 B架診斷：烘乾太慢！白天暫存區會堆積鞋子。";
        }

        // 動態生成顏色對照組看板
        let legendHtml = `<strong>🎨 批次顏色對照：</strong>`;
        for (let i = 0; i < wash_cycles; i++) {
            const color = batchColors[i % batchColors.length];
            legendHtml += `<span style="background-color: ${color}; color: #1e293b; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(0,0,0,0.1);">批次 ${i+1}</span>`;
        }
        document.getElementById('color_legend').innerHTML = legendHtml;

        renderSimulation(num_washers, wash_cap, wash_cycles, num_rooms, racks_per_room, currentTab);
    }

    function renderSimulation(num_washers, wash_cap, wash_cycles, num_rooms, racks_per_room, type) {
        const rack_cap = type === 'A' ? parseInt(document.getElementById('rack_a_cap').value) : parseInt(document.getElementById('rack_b_cap').value);
        const dry_hours = type === 'A' ? parseInt(document.getElementById('rack_a_hours').value) : parseInt(document.getElementById('rack_b_hours').value);
        const room_max_cap = racks_per_room * rack_cap;
        const wash_rate = num_washers * wash_cap;

        // 初始化追蹤物件陣列 (最多渲染4間房的欄位)
        let room_shoes = []; 
        for (let i = 0; i < 4; i++) room_shoes.push([]); // 二維陣列，存放每一房內含有的批次物件 [{batchId, shoes}]
        let room_time = new Array(4).fill(0);
        let waiting_batches = []; // 存放暫存區的排隊批次佇列
        let html = "";

        for (let h = 8; h <= 22; h++) {
            let hour_str = (h < 10 ? "0" + h : h) + ":00";
            let is_washing = (h >= 8 && h < 8 + wash_cycles);
            let batchId = h - 8;

            // 1. 處理洗鞋機欄位樣式
            let w1_html = '<span style="color: #94a3b8;">休息</span>';
            let w2_html = '<span style="color: #94a3b8;">休息</span>';
            if (num_washers < 1) w1_html = '<span style="color: #cbd5e1; font-size:12px;">無配置</span>';
            if (num_washers < 2) w2_html = '<span style="color: #cbd5e1; font-size:12px;">無配置</span>';

            if (is_washing) {
                if (num_washers >= 1) {
                    const color = batchColors[batchId % batchColors.length];
                    w1_html = `<span style="background-color: ${color}; color: #1e293b; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: inline-block; border: 1px solid rgba(0,0,0,0.08);">批${batchId + 1}: ${wash_cap}雙</span>`;
                }
                if (num_washers >= 2) {
                    const color = batchColors[batchId % batchColors.length];
                    w2_html = `<span style="background-color: ${color}; color: #1e293b; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: inline-block; border: 1px solid rgba(0,0,0,0.08);">批${batchId + 1}: ${wash_cap}雙</span>`;
                }
            }

            // 2. 處理 4 間烘乾房欄位樣式
            let r_html = [];
            for (let i = 0; i < 4; i++) {
                if (i < num_rooms) {
                    if (room_shoes[i] && room_shoes[i].length > 0) {
                        let tags = room_shoes[i].map(item => {
                            const color = batchColors[item.batchId % batchColors.length];
                            return `<span style="background-color: ${color}; color: #1e293b; padding: 3px 6px; border-radius: 4px; margin: 2px; display: inline-block; font-weight: bold; font-size: 12px; border: 1px solid rgba(0,0,0,0.08);">批${item.batchId + 1}: ${item.shoes}雙</span>`;
                        }).join('');
                        r_html.push(`<div>${tags}<span style="color: #64748b; font-size: 11px; display: block; margin-top: 4px; font-weight: bold;">⏳ 倒數 ${room_time[i]}h</span></div>`);
                    } else {
                        r_html.push('<span style="color: #94a3b8;">空</span>');
                    }
                } else {
                    r_html.push('<span style="color: #cbd5e1; font-size:12px;">無配置</span>');
                }
            }

            // 3. 處理暫存區欄位樣式
            let waiting_html = '';
            let total_waiting = waiting_batches.reduce((sum, b) => sum + b.shoes, 0);
            if (total_waiting === 0) {
                waiting_html = '<span style="color: #166534; font-weight: bold; background: #dcfce7; padding: 3px 8px; border-radius: 20px;">0 雙</span>';
            } else {
                waiting_html = `<div><span style="color: #b91c1c; font-weight: bold; display: block; margin-bottom: 5px; font-size:14px;">共 ${total_waiting} 雙</span><div style="display:flex; flex-wrap:wrap; gap:3px; justify-content:center;">`;
                waiting_html += waiting_batches.map(item => {
                    if (item.shoes === 0) return '';
                    const color = batchColors[item.batchId % batchColors.length];
                    return `<span style="background-color: ${color}; color: #1e293b; padding: 2px 5px; border-radius: 4px; display: inline-block; font-size: 11px; font-weight: bold; border: 1px solid rgba(0,0,0,0.05);">批${item.batchId + 1}: ${item.shoes}雙</span>`;
                }).join('') + '</div></div>';
            }

            // 組合列
            html += `<tr>
                <td><strong>${hour_str}</strong></td>
                <td>${w1_html}</td>
                <td>${w2_html}</td>
                <td>${r_html[0]}</td>
                <td>${r_html[1]}</td>
                <td>${r_html[2]}</td>
                <td>${r_html[3]}</td>
                <td>${waiting_html}</td>
            </tr>`;

            // === 滾動狀態時間推移 (為下一小時做準備) ===
            // A. 烘乾房時間倒數
            for (let i = 0; i < num_rooms; i++) {
                if (room_time[i] > 0) {
                    room_time[i]--;
                    if (room_time[i] === 0) room_shoes[i] = []; // 時間到，出爐清空
                }
            }

            // B. 洗好的新批次加入排隊佇列
            if (is_washing) {
                waiting_batches.push({ batchId: batchId, shoes: wash_rate });
            }

            // C. 推進烘乾房 (先進先出，支援拆批與跨批混塞)
            for (let i = 0; i < num_rooms; i++) {
                if (room_time[i] === 0 && waiting_batches.length > 0) {
                    let space_left = room_max_cap;
                    room_shoes[i] = [];
                    
                    while (space_left > 0 && waiting_batches.length > 0) {
                        let current_batch = waiting_batches[0];
                        let load = Math.min(current_batch.shoes, space_left);
                        
                        if (load > 0) {
                            room_shoes[i].push({ batchId: current_batch.batchId, shoes: load });
                            current_batch.shoes -= load;
                            space_left -= load;
                        }
                        if (current_batch.shoes === 0) {
                            waiting_batches.shift(); // 該批次排隊清空，移出佇列
                        }
                    }
                    if (room_shoes[i].length > 0) {
                        room_time[i] = dry_hours; // 有放鞋子進去，啟動計時
                    }
                }
            }
        }
        document.getElementById('table_body').innerHTML = html;
    }

    updateAll();
</script>
</body>
</html>
